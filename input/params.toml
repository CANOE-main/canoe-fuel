# canoe-fuel configuration
# See common.py:CANOEFuelConfig for field documentation.

# Path to the SQLite database created by canoe-base.
# The module opens this DB and appends its own rows; it does not create the DB.
db_dir = "canoe-debug.sqlite"

# EIA AEO report year. Check the EIA website for the most recent available year.
eia_year = 2025

# Version tag for this data run (numeric digits only, used in data_id namespacing).
version = "002"

# Target schema version (must match the installed canoe-schema package).
schema_version = "4.0"

# Model periods to produce data for (future periods; flag='f' in time_period table).
future_periods = [2025, 2030, 2035, 2040, 2045]

# Provinces to produce data for. 'CAN' is a national aggregate used for data_id
# namespacing only — it is not a row in the region table.
province_list = ["AB", "ON", "BC", "MB", "SK", "QC", "NLLAB", "NS", "NB", "PEI", "CAN"]

# Whether to raise an error or emit a warning when the DB is missing expected
# periods or regions. Set to 'warning' for development; keep 'error' in production.
validation_behavior = "error"

# EIA series filter parameters (expose here so they are reviewable, not buried in code).
eia_unit_filter = "2024 $/MMBtu"
eia_exclude_pattern = "average"

# Fuel price for uranium. Source: NREL ATB electricity sector report.
# Fuel cost in $/MMBtu; assumed constant across all periods.
u_price = 1.09

# Fuel price for biomass/wood. Source: NREL ATB electricity sector report.
# Fuel cost in $/MMBtu; assumed constant across all periods.
b_price = 5.449635
# Fuel list filtering (optional, mutually exclusive with each other).
