# Currency and inflation adjustment factors (sub-model: InflationFactors).
# These are documented constants — change only if the deflation base year changes.
[inflation]
# GDP deflator to convert 2022-dollar prices (NREL ATB) to real 2020 CAD.
deflation_2022 = 0.861446913
# GDP deflator to convert 2024/2025-dollar prices (EIA AEO) to real 2020 CAD.
deflation_2025 = 0.877689699
# USD to CAD exchange rate applied to all EIA/NREL prices.
currency_adjustment = 1.22
# 1 MMBtu = 1.055 GJ; used to convert $/MMBtu to $/GJ before PJ-scale adjustment.
mmbtu_convertor = 1.055
# Fixed 2020 M$/PJ price for ethanol.
# Source: Wolinetz & Harrison, Biofuels in Canada 2023 (avg 2012-2022, no projection).
eth_price = 25.801332399
# Fixed 2020 M$/PJ price for renewable diesel (50% biodiesel + 50% HDRD).
# Source: Wolinetz & Harrison, Biofuels in Canada 2023.
rdsl_price = 34.286607549
# Fixed 2020 M$/PJ price for synthetic jet fuel (SPK/HRJ pathway).
# Source: NREL ATB.
spk_price = 53.947379869
